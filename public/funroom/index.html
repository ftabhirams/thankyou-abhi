<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fun Room</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-main: #0f172a; --bg-panel: #1e293b; --bg-input: #334155;       
            --accent: #6366f1; --accent-hover: #4f46e5;
            --secondary: #10b981; --danger: #ef4444;         
            --text-main: #f8fafc; --text-muted: #94a3b8;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: var(--bg-main); color: var(--text-main); font-family: 'Inter', sans-serif; display: flex; height: 100vh; overflow: hidden; }
        
        #auth-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 1000; display: flex; align-items: center; justify-content: center; }
        .auth-card { background: var(--bg-panel); padding: 30px; border-radius: 12px; width: 90%; max-width: 400px; text-align: center; }
        
        .app-container { display: flex; width: 100%; height: 100%; }
        
        @media (max-width: 768px) {
            .app-container { flex-direction: column; overflow-y: auto; }
            .sidebar { width: 100% !important; border-left: none; border-top: 1px solid rgba(255,255,255,0.05); }
            .main-stage { padding: 10px !important; min-height: 50vh; }
        }

        .main-stage { flex: 1; display: flex; flex-direction: column; padding: 24px; gap: 15px; position: relative; }
        .sidebar { width: 350px; background: var(--bg-panel); display: flex; flex-direction: column; padding: 20px; gap: 15px; }

        h2 { font-size: 20px; display: flex; align-items: center; gap: 8px; }
        h3 { font-size: 14px; color: var(--text-muted); text-transform: uppercase; margin-bottom: 10px;}

        .hardware-controls { display: flex; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; }
        .icon-btn { padding: 10px 15px; border-radius: 8px; border: none; background: var(--bg-input); color: white; cursor: pointer; transition: 0.2s; font-size: 16px; }
        .icon-btn:hover { background: #475569; }
        .icon-btn.off { background: var(--danger); }

        .media-wrapper { flex-grow: 1; position: relative; background: #000; border-radius: 12px; overflow: hidden; box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5); }
        #yt-player, #html5-video { width: 100%; height: 100%; border: none; }
        
        .floating-videos {
            position: absolute; top: 15px; right: 15px; display: flex; flex-direction: column; gap: 10px; z-index: 50; pointer-events: none;
        }
        .video-wrapper { position: relative; pointer-events: auto; }
        .video-wrapper video { 
            width: 140px; height: 100px; object-fit: cover; background: #222; 
            border-radius: 12px; border: 2px solid rgba(255,255,255,0.2); box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        .control-group { display: flex; gap: 8px; margin-bottom: 10px; }
        input { flex: 1; padding: 10px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.1); background: var(--bg-input); color: white; }
        button { padding: 10px 15px; border-radius: 8px; border: none; background: var(--accent); color: white; font-weight: 600; cursor: pointer; }
        
        .panel-section { background: rgba(0,0,0,0.2); border-radius: 12px; padding: 15px; display: flex; flex-direction: column; max-height: 50%; }
        
        #queue-list { list-style: none; margin: 10px 0; overflow-y: auto; }
        #queue-list li { 
            padding: 10px; background: var(--bg-input); border-radius: 8px; margin-bottom: 8px; font-size: 13px; 
            border-left: 3px solid var(--accent); display: flex; justify-content: space-between; align-items: center;
        }
        .play-queue-btn { background: var(--secondary); padding: 4px 8px; font-size: 11px; display: none; }
        .host-mode .play-queue-btn { display: block; } 

        .chat-container { flex-grow: 1; display: flex; flex-direction: column; overflow: hidden; }
        #chat-box { flex-grow: 1; overflow-y: auto; margin-bottom: 15px; font-size: 13px; display: flex; flex-direction: column; gap: 8px; }
        .chat-msg { background: var(--bg-input); padding: 8px 12px; border-radius: 12px; border-bottom-left-radius: 2px; max-width: 90%; align-self: flex-start; word-wrap: break-word;}
        .chat-msg.self { background: var(--accent); align-self: flex-end; border-bottom-left-radius: 12px; border-bottom-right-radius: 2px; }
        .chat-msg b { color: var(--secondary); font-size: 11px; display: block;}
        .chat-msg.self b { color: #fff; opacity: 0.8; }
    </style>
</head>
<body>

    <div id="auth-overlay">
        <div class="auth-card">
            <h2 style="justify-content: center; margin-bottom: 20px;">🛋️ Enter Fun Room</h2>
            <input type="text" id="room-name" placeholder="Room Name (e.g. Squad123)" style="width: 100%; margin-bottom: 10px;">
            <input type="password" id="room-pass" placeholder="Password (Optional)" style="width: 100%; margin-bottom: 15px;">
            <button onclick="joinRoom()" style="width: 100%;">Join / Create Room</button>
            <p id="auth-err" style="color: var(--danger); font-size: 13px; margin-top: 10px;"></p>
            <a href="/" style="display: block; margin-top: 20px; color: var(--text-muted); text-decoration: none; font-size: 14px;">← Back to Hub</a>
        </div>
    </div>

    <div class="app-container" id="main-app" style="display: none;">
        
        <div class="main-stage">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <h2>
                    🛋️ Fun Room <span id="room-display-name" style="color: var(--text-muted); font-size: 14px; margin-left: 10px;"></span>
                    <span id="host-badge" style="display: none; font-size: 12px; background: #eab308; color: #000; padding: 2px 8px; border-radius: 20px; margin-left: 10px;">👑 Host</span>
                </h2>
                <button class="icon-btn" onclick="toggleFullScreen()" title="Full Screen">⛶</button>
            </div>

            <div class="hardware-controls">
                <button id="cam-btn" class="icon-btn" onclick="toggleCamera()">📷 Cam On</button>
                <button id="mic-btn" class="icon-btn" onclick="toggleMic()">🎤 Mic On</button>
                <button id="screen-share-btn" class="icon-btn" onclick="toggleScreenShare()" style="background: var(--secondary);">🖥️ Share Screen</button>
            </div>
            
            <div class="media-wrapper" id="media-wrapper">
                <div class="floating-videos" id="video-grid">
                    <div class="video-wrapper">
                        <video id="my-video" muted autoplay playsinline></video>
                    </div>
                </div>

                <div id="yt-player-container" style="width: 100%; height: 100%;">
                    <div id="yt-player"></div>
                </div>
                <div id="html5-player-container" style="display: none; width: 100%; height: 100%;">
                    <video id="html5-video" controls controlslist="nodownload"></video>
                </div>
            </div>
        </div>

        <div class="sidebar">
            <div class="panel-section">
                <h3>🎵 Media Queue</h3>
                
                <div class="control-group">
                    <input type="text" id="video-id-input" placeholder="YouTube URL or Search">
                    <button onclick="addToQueue()">Queue YT</button>
                </div>
                
                <div class="control-group" id="direct-video-container" style="display: none;">
                    <input type="text" id="direct-video-input" placeholder="Direct .mp4 link">
                    <button onclick="loadDirectMovie()" style="background: var(--secondary);">Play Movie</button>
                </div>

                <ul id="queue-list"></ul>
            </div>

            <div class="panel-section chat-container">
                <h3>💬 Chat</h3>
                <div id="chat-box"></div>
                <div class="control-group" style="margin-bottom: 0;">
                    <input type="text" id="chat-input" placeholder="Say something..." onkeypress="handleChat(event)">
                </div>
            </div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="https://www.youtube.com/iframe_api"></script>
    <script src="script.js"></script>
</body>
</html>
